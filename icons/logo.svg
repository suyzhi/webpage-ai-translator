<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#302d29"/>
      <stop offset="100%" stop-color="#151412"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#da4f30"/>
      <stop offset="100%" stop-color="#b33419"/>
    </linearGradient>
    <clipPath id="inkClip">
      <rect x="6" y="6" width="76" height="76" rx="18"/>
    </clipPath>
    <filter id="tileShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="-2" dy="-2" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.54"/>
    </filter>
  </defs>

  <!-- Back tile: warm matte sumi-ink -->
  <rect x="6" y="6" width="76" height="76" rx="18" fill="url(#ink)"/>
  <rect x="6.75" y="6.75" width="74.5" height="74.5" rx="17.25" fill="none" stroke="#f7f4ec" stroke-opacity="0.20" stroke-width="1.4"/>

  <!-- Editorial Didone Serif A (thick right stem, fine left stem, crisp serif feet) -->
  <path fill="#f7f4ec" fill-rule="evenodd"
    d="M29.9 18.2H32.6L42.8 47.0H45.2V49.2H34.2V47.0H36.8L34.7 40.8H24.6L22.5 47.0H25.2V49.2H16.6V47.0H19.1L29.9 18.2Z
       M30.1 24.4L25.5 38.0H33.8L30.1 24.4Z"/>

  <!-- Layered drop shadow cast onto back tile -->
  <g clip-path="url(#inkClip)">
    <rect x="46" y="46" width="76" height="76" rx="18" fill="#000000" fill-opacity="0.34" filter="url(#tileShadow)"/>
  </g>

  <!-- Front tile: lacquer shu-iro vermilion seal -->
  <rect x="46" y="46" width="76" height="76" rx="18" fill="url(#seal)"/>
  <rect x="46.75" y="46.75" width="74.5" height="74.5" rx="17.25" fill="none" stroke="#fff8f4" stroke-opacity="0.22" stroke-width="1.4"/>

  <!-- Sculpted modern-Songti 文 (modulated calligraphic strokes) -->
  <g fill="#fdfbf7">
    <!-- Ink-drop 点 -->
    <path d="M81.2 60.4C84.2 61.5 87.0 64.1 87.9 67.4C88.3 69.1 86.9 70.3 85.2 69.9C83.3 69.4 81.9 66.8 80.2 62.1C79.8 61.0 80.3 60.1 81.2 60.4Z"/>
    <!-- Horizontal 横 with subtle Songti terminal -->
    <path d="M62.8 74.6C62.8 73.4 63.6 72.7 64.8 72.7H99.4L101.6 70.6C102.4 69.9 103.5 70.1 104.2 71.0L105.8 73.1C106.5 74.0 106.0 76.2 104.6 76.2H64.8C63.6 76.2 62.8 75.6 62.8 74.6Z"/>
    <!-- Modulated sweeping 撇 -->
    <path d="M97.4 75.4C94.5 89.2 84.5 100.8 63.4 107.2C62.0 107.6 61.4 106.2 62.5 105.4C80.2 97.3 88.6 87.0 91.2 75.4Z"/>
    <!-- Modulated sweeping 捺 with graceful Songti flare -->
    <path d="M76.0 75.4C79.8 87.2 89.2 96.4 106.8 103.6C107.6 104.0 107.4 105.0 106.4 105.4L101.2 107.1C99.7 107.6 98.4 107.4 97.1 106.6C84.2 99.4 76.2 89.8 71.2 75.4Z"/>
  </g>
</svg>
