<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI 网页翻译</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></symbol>
    <symbol id="i-translate" viewBox="0 0 24 24"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></symbol>
    <symbol id="i-dual" viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 10h11"/><path d="M4 15h16" opacity=".45"/><path d="M4 19h11" opacity=".45"/></symbol>
    <symbol id="i-single" viewBox="0 0 24 24"><path d="M4 8h16"/><path d="M4 13h16"/><path d="M4 18h10"/></symbol>
  </svg>

  <header class="head">
    <div class="logo"><img src="../../icons/icon32.png" alt="" width="22" height="22"></div>
    <div class="grow">
      <h1>AI 网页翻译</h1>
      <div class="sub truncate" id="subtitle"><span class="model-dot"></span><span id="modelLabel"></span></div>
    </div>
    <button class="btn btn-ghost icon" id="openOptions" title="打开设置" aria-label="打开设置"><svg class="i"><use href="#i-gear"/></svg></button>
  </header>

  <div id="noKey" class="banner warn hidden">
    <div class="grow">尚未配置 AI API 密钥，无法翻译。</div>
    <button class="btn btn-primary tiny" id="goOptions">去设置</button>
  </div>

  <div id="errorBox" class="banner err hidden"><div class="grow" id="errorText"></div></div>

  <section class="status card" aria-live="polite">
    <div class="ring" id="ring">
      <svg class="ring-svg" viewBox="0 0 44 44" aria-hidden="true">
        <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs>
        <circle class="track" cx="22" cy="22" r="18"/>
        <circle class="val" id="ringVal" cx="22" cy="22" r="18" pathLength="100"/>
      </svg>
      <span class="ring-label mono" id="statusPercent"></span>
      <svg class="ring-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-translate"/></svg>
    </div>
    <div class="grow">
      <div class="status-row"><span class="pill" id="statusPill">未翻译</span></div>
      <div class="detail truncate" id="statusDetail"></div>
      <div class="usage truncate" id="usageLine" title="token 用量：本页 / 累计（输入含命中缓存部分）"></div>
    </div>
    <div class="bar hidden-bar" id="progressBar"><i></i></div>
  </section>

  <div class="actions">
    <button class="btn btn-primary grow" id="mainBtn">翻译此页面</button>
    <button class="btn hidden" id="restoreBtn" title="还原为原文"><svg class="i"><use href="#i-undo"/></svg>还原</button>
  </div>

  <section class="quick">
    <div class="quick-head">翻译设置</div>

    <div class="field">
      <label class="label" for="targetLang"><span class="lbl"><svg class="i"><use href="#i-globe"/></svg>目标语言</span></label>
      <select id="targetLang"></select>
    </div>

    <div class="field">
      <div class="label"><span class="lbl" id="displayLabel"><svg class="i"><use href="#i-dual"/></svg>显示方式</span></div>
      <div class="seg" id="displaySeg" role="group" aria-labelledby="displayLabel">
        <button type="button" data-value="bilingual" aria-pressed="true"><svg class="i"><use href="#i-dual"/></svg>双语对照</button>
        <button type="button" data-value="translation" aria-pressed="false"><svg class="i"><use href="#i-single"/></svg>仅译文</button>
      </div>
    </div>

  </section>

  <footer class="foot">
    <a href="#" class="muted tiny" id="shortcut" title="快捷键：翻译 / 还原（点击修改）"><kbd>⌥</kbd> <kbd>A</kbd></a>
    <a href="#" class="tiny shortcut-warn hidden" id="shortcutWarn" title="浏览器保留了旧的快捷键绑定，点击前往设置">快捷键未更新</a>
    <label class="site-auto hidden" id="siteAutoRow">
      <span class="toggle mini"><input type="checkbox" id="siteAuto"><span class="track"></span></span>
      <span class="tiny">自动翻译此站</span>
    </label>
    <span class="grow"></span>
    <a href="#" class="tiny" id="footOptions">全部设置 →</a>
  </footer>

  <script src="../shared/constants.js"></script>
  <script src="../shared/util.js"></script>
  <script src="../shared/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
